# =============================================================================
# jobs.yaml — 调度收敛唯一事实清单(架构蓝图 v2 L1 编排层第一步,P2.1)
# =============================================================================
# 本文件登记本系统**全部**定时/触发调度,分两类:
#   jobs(cron 类): 服务器 crontab 真实行(root/deploy 两用户),由 tools/verify-cron.cjs 强制比对漂移
#   soft(备查类):  非 crontab 的调度源(backend 内部定时器/登录钩子/本机例程),仅登记
# 规则(2026-11-24 起):
#   1. 改任何 cron 必须**先改本文件再 install/手工同步**,禁止只改 crontab;
#   2. verify-cron.cjs 漂移≠0 视为异常;
#   3. P2.2 将用 install-crontab.sh 从本清单生成两份 crontab,届时本文件即安装源。
# 注意: line 字段 = crontab 里第 6 列起的**原样命令**(校验按空白归一化比对,双空格无碍);
#       多槽位作业 schedule 用列表(一个作业对应多行 crontab)。
# =============================================================================

meta:
  server: "marketineok.com (119.28.157.150)"
  crontab_users: [root, deploy]
  verify: tools/verify-cron.cjs

jobs:

  # ── 系统/面板任务(非本系统代码,登记备查) ─────────────────────────────
  - { id: system-stargate,    user: root,  schedule: "*/5 * * * *", category: system,
      desc: "腾讯云监控 agent 拉起,与本系统无关",
      line: "flock -xn /tmp/stargate.lock -c '/usr/local/qcloud/stargate/admin/start.sh > /dev/null 2>&1 &'" }
  - { id: system-bt-acme,     user: root,  schedule: "6 8 * * *", category: system,
      desc: "宝塔面板 ACME 证书续期(acme_v2.py --renew),与本系统无关",
      line: "/www/server/cron/3ab48c27ec99cb9787749c362afae517 >> /www/server/cron/3ab48c27ec99cb9787749c362afae517.log 2>&1" }

  # ── root crontab:本系统运维 ─────────────────────────────────────────
  - { id: db-backup,          user: root,  schedule: "0 3 * * *", category: ops,
      desc: "数据库/文件备份(deploy/backup.sh)",
      line: "/bin/bash /opt/saas/deploy/backup.sh >> /var/log/saas-backup.log 2>&1" }
  - { id: spark-all,          user: root,  schedule: "30 5 * * *", category: sync, needs_cookie: all,
      desc: "全品牌星火晨间全量(spark/sync all,campaign+notes 各品牌 T-1)",
      line: "/bin/bash /opt/saas/deploy/cron-sync-spark-all.sh" }
  - { id: mdd-covers,         user: root,  schedule: "24 * * * *", category: sync,
      desc: "MDD 封面慢补(每小时 15 条;og:image/浏览器双路已被风控打死,11-24 起 fid 直链已在同步源头写入,此任务仅兜底,可评估下线)",
      line: "/bin/bash /opt/saas/deploy/cron-sync-mdd-covers.sh" }
  - { id: tesla-nickname-reconcile, user: root, schedule: "40 10 * * *", category: sync,
      desc: "特斯拉昵称对账(data-import/reconcile-tesla-nicknames.js --apply)",
      line: "cd /opt/saas && /usr/local/bin/node data-import/reconcile-tesla-nicknames.js --apply >> /var/log/saas-reconcile-nicknames.log 2>&1" }
  - { id: patrol-morning,     user: root,  schedule: "20 8 * * *", category: ops,
      desc: "数据源巡检日报(L1-L5,--push 企微)",
      line: "cd /opt/saas/tools && /usr/local/bin/node patrol.cjs --push >> /var/log/saas-patrol.log 2>&1" }
  - { id: session-watch,      user: root,  schedule: "*/30 * * * *", category: ops,
      desc: "会话断线监视(session-watch.cjs)",
      line: "cd /opt/saas/tools && /usr/local/bin/node session-watch.cjs >> /var/log/saas-session-watch.log 2>&1" }
  - { id: patrol-dawn,        user: root,  schedule: "30 6 * * *", category: ops,
      desc: "06:30 晨检(出数判定窗口)",
      line: "cd /opt/saas/tools && /usr/local/bin/node patrol.cjs --push >> /var/log/saas-patrol-0630.log 2>&1" }

  # ── deploy crontab:数据同步波次(运营时刻表 2026-11-08 定版) ──────────
  - { id: pro-clue,           user: deploy, schedule: ["0 4 * * *", "0 9 * * *"], category: sync, needs_cookie: [2],
      desc: "荣威专业号线索(pro_clue_tool 权威漏斗口径)",
      line: "/opt/saas/deploy/cron-sync-pro-clue.sh" }
  - { id: pro-clue-mdd,       user: deploy, schedule: ["5 4 * * *"], category: sync, needs_cookie: [5],
      desc: "MDD 专业号线索",
      line: "/opt/saas/deploy/cron-sync-pro-clue-mdd.sh" }
  - { id: mdd-notes,          user: deploy, schedule: ["40 5 * * *"], category: sync, needs_cookie: [5],
      desc: "MDD 笔记链四步(notes/notes_daily/clue_analysis/clue_acq_tool)",
      line: "/opt/saas/deploy/cron-sync-mdd-notes.sh" }
  - { id: df-notes,           user: deploy, schedule: ["50 5 * * *"], category: sync, needs_cookie: [7],
      desc: "奕境笔记链四步(同 MDD;线索两槽 11-24 新增)",
      line: "/opt/saas/deploy/cron-sync-df-notes.sh" }
  - { id: kos-daytier,        user: deploy, schedule: ["0 8 * * *", "0 10 * * *"], category: sync, needs_cookie: all,
      desc: "KOS 分层重算(kos-tier)",
      line: "/opt/saas/deploy/cron-sync-kos-daytier.sh" }
  - { id: mdd-values-refresh, user: deploy, schedule: ["50 5,11,17 * * *"], category: sync, needs_cookie: [5],
      desc: "MDD KoxNote 数值列刷新(MCC 笔记分析 all_key)",
      line: "/opt/saas/deploy/cron-sync-mdd-values-refresh.sh" }
  - { id: df-values-refresh,  user: deploy, schedule: ["50 5,11,17 * * *"], category: sync, needs_cookie: [7],
      desc: "奕境 KoxNote 数值列刷新(含私信三数/封面 fid/无标题回填)",
      line: "/opt/saas/deploy/cron-sync-df-values-refresh.sh >> /opt/saas/logs/df-values-refresh.log 2>&1" }
  - { id: mdd-notes-heavy,    user: deploy, schedule: ["5 13 * * *"], category: sync, needs_cookie: [5],
      desc: "MDD 笔记重拉(13:05 可靠槽)",
      line: "/opt/saas/deploy/cron-sync-mdd-notes-heavy.sh" }
  - { id: juguang-content,    user: deploy, schedule: ["0 14 * * *", "30 12 * * *"], category: sync, needs_cookie: [6],
      desc: "特斯拉聚光商业内容同步(12:30/14:00 两槽)",
      line: "/opt/saas/deploy/cron-sync-juguang-content.sh" }
  - { id: juguang-t1,         user: deploy, schedule: ["10 7 * * *", "10 13 * * *"], category: sync, needs_cookie: [6],
      desc: "特斯拉标准投 T-1(07:10 首试/13:10 可靠槽,凌晨白跑实证)",
      line: "/opt/saas/deploy/cron-sync-juguang-t1.sh" }
  - { id: mcc-ndsp-backfill,  user: deploy, schedule: ["15 13 * * *"], category: sync, needs_cookie: all,
      desc: "MCC NDS 员工矩阵回补(NDS×3+员工矩阵 T-1×3)",
      line: "/opt/saas/deploy/cron-sync-mcc-ndsp-backfill.sh" }
  - { id: stat-catchup,       user: deploy, schedule: ["40 0 * * *", "40 12 * * *", "10 14 * * *"], category: sync, needs_cookie: all,
      desc: "统计兜底三槽(00:40/12:40/14:10)",
      line: "/opt/saas/deploy/cron-sync-stat-catchup.sh" }
  - { id: stat-smart-pull,    user: deploy, schedule: ["*/30 1-10 * * *"], category: sync, needs_cookie: all,
      desc: "01:00-10:30 每 30 分钟智能拉取(白天高频兜底)",
      line: "/opt/saas/deploy/cron-sync-stat-smart-pull.sh" }
  - { id: juguang-weekly,     user: deploy, schedule: ["30 23 * * 0"], category: sync, needs_cookie: [6],
      desc: "周日特斯拉聚光全窗校准(月段深分页缺半的周度补)",
      line: "cd /opt/saas/tools/spark && flock -n /tmp/juguang-weekly.lock /usr/local/bin/node sync-juguang.cjs >> /opt/saas/logs/juguang-weekly.log 2>&1" }

# ── soft 类(非 crontab,登记备查,verify 不校验) ────────────────────
soft:
  - { id: backend-safesync, where: "saas-api 进程内部定时器", schedule: "每 60 分钟(SPARK_SYNC_INTERVAL_MINUTES)",
      desc: "safeSync 全组织 campaign/notes/staff_matrix 补拉(滚动回看 SPARK_LOOKBACK_DAYS=7 天,hasSuccessLog fetched>0 锁日)" }
  - { id: pull-t1, where: "登录钩子(partner-keepalive-local 登录成功后触发)", schedule: "每天 21:30 登录事件后",
      desc: "登录即全量落库编排器(deploy/pull-t1-after-login.sh):探针等出数→特斯拉→MDD 四步→奕境线索两步" }
  - { id: local-daily-login, where: "本机 Windows 人工例程", schedule: "每天 21:30",
      desc: "daily-login.cmd 六步(partner→pro→荣威→MDD→奕境→格力滑块),唯一 MCC 登录通道;失败会「假完成推旧 cookie」(2026-11-24 复发)" }
  - { id: local-keepalive, where: "本机 Windows 计划任务", schedule: "每天 08:50/20:50",
      desc: "partner/pro 探活+pull-t1 触发(keepalive-local.log)" }
