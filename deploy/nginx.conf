#=============================================================================
# saas — Nginx 站点配置模板
# 说明：
#   - setup-server.sh 已自动安装此配置，此文件供人工核对/重装使用
#   - 先以 HTTP(80) 跑通，再执行 certbot --nginx -d <域名> 自动追加 443 与证书
#   - 路径：<域名> 替换为实际域名；前端目录默认 /var/www/saas-web
#=============================================================================

server {
    listen 80;
    server_name <your-domain>;

    root /var/www/saas-web;
    index index.html;

    # 上传体积（批量导入等场景）
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1k;

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 禁缓存：发版后浏览器及时拉取新资源引用，避免旧分片 404 白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端静态资源长缓存（Vite 产物带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 后端 API 反向代理（保留 /api/agency-api 前缀，不加尾斜杠）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# certbot 执行后会自动生成如下 443 段（示例，无需手写）：
# server {
#     listen 443 ssl http2;
#     server_name <your-domain>;
#     ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
#     ...（其余配置与 80 段相同，certbot 会自动 include/复制）
# }
